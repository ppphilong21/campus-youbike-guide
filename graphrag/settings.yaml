### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## Campus YouBike Guide: tested with graphrag 3.3.0 and Ollama on a CPU-only laptop.
## Both models run locally through Ollama. The api_key is a placeholder: GraphRAG requires
## one, Ollama ignores it.

concurrent_requests: 1   # on a CPU laptop, one request at a time is fastest per call

completion_models:
  default_completion_model:
    model_provider: ollama_chat
    model: qwen3:4b-instruct-2507-q4_K_M   # non-thinking model; plain qwen3:4b now thinks even with think: false
    api_base: http://localhost:11434
    api_key: ollama
    call_args:
      think: false        # no effect on the instruct model; turns thinking off for qwen3:8b in the ablation
      num_ctx: 12288      # context window; GraphRAG prompts are long
      max_tokens: 3000    # caps each answer; 2000 still cut one dense extraction (gates and parking list)
      seed: 42            # same input, same output: makes the index and the evaluation reproducible
      timeout: 1200       # seconds per call (3000 tokens at ~6 tokens/s is about 8 minutes)
    retry:
      type: exponential_backoff
      max_retries: 2

embedding_models:
  default_embedding_model:
    model_provider: ollama
    model: bge-m3
    api_base: http://localhost:11434
    api_key: ollama
    retry:
      type: exponential_backoff

### Document processing settings ###

input:
  type: text # [csv, text, json, jsonl]

chunking:
  type: tokens
  size: 400       # small chunks keep each extraction answer under max_tokens (600 still cut 1 of 8)
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, sqlite, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "cache"
  # database_name: "cache.db" # Only used when type is sqlite
    
vector_store:
  type: lancedb
  db_uri: output/lancedb

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  # The knowledge graph schema. youbike_station is separate from bus_stop and parking so that
  # "nearest station" questions do not pick up shuttle bus stops or GoStation battery points.
  entity_types: [youbike_station, bus_stop, parking, building, landmark, gate, road, district, facility, department, office, service, rule, fee, payment_method, user_group]
  max_gleanings: 0   # 1 doubles the extraction calls; 0 is much faster on CPU

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 25   # default 10 gave 18 reports for 7 files; bigger clusters mean far fewer reports
  use_lcc: false   # the default (true) clusters only the largest connected part of the graph, and
                   # local search then ignores every entity outside it (e.g. all fees in a small corpus)

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 300          # words per report; report writing was 58% of the test run on a CPU
  max_input_length: 6000   # keeps prompt plus answer inside num_ctx

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

# Search context limits: the defaults (12,000 tokens) plus the prompt and the answer would not fit
# in num_ctx 12,288, and Ollama would silently cut the start of the prompt.
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"
  max_context_tokens: 7000

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"
  max_context_tokens: 7000
  data_max_tokens: 7000

drift_search:
  concurrency: 2
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"
  data_max_tokens: 7000
  primer_llm_max_tokens: 7000
  local_search_max_data_tokens: 7000
  # fewer model calls per question, so DRIFT finishes in minutes on a CPU (defaults: 5, 3, 20)
  primer_folds: 2
  n_depth: 1
  drift_k_followups: 3

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
  max_context_tokens: 7000
